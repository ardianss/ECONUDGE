<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECONUDGE — Interactive Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,-50..200" rel="stylesheet">
<style>
  :root{
    --primary:#0FA968;
    --primary-dark:#0B7A4C;
    --primary-light:#DCF3E7;
    --secondary:#1B4332;
    --accent:#38BDF8;
    --accent-light:#E3F5FE;
    --highlight:#FBBF24;
    --highlight-dark:#B45309;
    --white:#FFFFFF;
    --light-gray:#F1F5F2;
    --mid-gray:#D8E2DD;
    --dark-gray:#3A4A42;
    --text-muted:#6B7A73;
    --danger:#E4572E;
    --insight:#6D5DD3;
    --insight-light:#EFEBFB;
    --bg-gradient:linear-gradient(180deg,#F3FBF6 0%,#E7F4EC 55%,#DDEFE4 100%);
    --radius-lg:26px;
    --radius-md:18px;
    --radius-sm:12px;
    --shadow-card:0 10px 28px rgba(15,77,52,0.10);
    --shadow-pop:0 16px 40px rgba(15,77,52,0.20);
    --font-display:'Plus Jakarta Sans',sans-serif;
    --font-body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    background:#0F2A1E;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:28px 12px;
  }
  .stage{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .stage-label{
    font-family:var(--font-display);color:#C9E6D6;font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;opacity:.7;font-weight:600;
  }
  .device{
    width:390px;height:820px;
    background:#050505;
    border-radius:52px;
    padding:14px;
    box-shadow:0 30px 70px rgba(0,0,0,0.55), 0 0 0 2px #1a1a1a inset;
    position:relative;
  }
  .screen-wrap{
    width:100%;height:100%;
    background:var(--bg-gradient);
    border-radius:38px;
    overflow:hidden;
    position:relative;
    display:flex;flex-direction:column;
  }
  .notch{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);
    width:120px;height:26px;background:#050505;border-radius:20px;z-index:50;
  }
  .statusbar{
    height:46px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 26px 6px;font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--secondary);
  }
  .statusbar .icons{display:flex;gap:5px;align-items:center;font-size:15px;}
  .content{flex:1 1 auto;overflow-y:auto;position:relative;scrollbar-width:none;}
  .content::-webkit-scrollbar{display:none;}
  .msr{font-family:'Material Symbols Rounded';font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;font-size:22px;line-height:1;}
  .msr.fill{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24;}

  /* ---------- Generic building blocks ---------- */
  .px{padding-left:22px;padding-right:22px;}
  .section-title{font-family:var(--font-display);font-weight:800;font-size:19px;color:var(--secondary);margin:0 0 12px;}
  .eyebrow{font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--primary-dark);opacity:.8;margin-bottom:4px;display:block;}
  .card{background:var(--white);border-radius:var(--radius-md);box-shadow:var(--shadow-card);padding:18px;}
  .btn{
    font-family:var(--font-display);font-weight:700;font-size:15px;border:none;border-radius:100px;
    padding:15px 20px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
    min-height:48px;transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 10px 22px rgba(15,169,104,0.35);}
  .btn-secondary{background:var(--white);color:var(--secondary);border:1.5px solid var(--mid-gray);}
  .btn-ghost{background:transparent;color:var(--secondary);}
  .btn-block{width:100%;}
  .top-app-bar{
    display:flex;align-items:center;justify-content:space-between;padding:6px 22px 14px;flex:0 0 auto;
  }
  .icon-btn{
    width:40px;height:40px;border-radius:100px;background:var(--white);display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 10px rgba(15,77,52,0.10);color:var(--secondary);border:none;cursor:pointer;flex:0 0 auto;
  }
  .avatar{width:40px;height:40px;border-radius:100px;background:linear-gradient(135deg,var(--accent),#0EA5E9);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:15px;}
  .chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-body);font-weight:600;font-size:11px;padding:5px 10px;border-radius:100px;}
  .chip-green{background:var(--primary-light);color:var(--primary-dark);}
  .chip-blue{background:var(--accent-light);color:#0369A1;}
  .chip-gold{background:#FEF3C7;color:var(--highlight-dark);}
  .chip-gray{background:var(--light-gray);color:var(--text-muted);}
  .badge-dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:100px;background:var(--danger);border:2px solid var(--white);}

  /* Insight (behavioral mapping) layer */
  .insight-tag{
    display:inline-flex;align-items:center;gap:5px;background:var(--insight);color:#fff;font-family:var(--font-body);
    font-weight:600;font-size:10.5px;padding:4px 9px 4px 7px;border-radius:100px;box-shadow:0 4px 10px rgba(109,93,211,.35);
    animation:pop .25s ease;
  }
  .insight-wrap{position:relative;}
  .insight-float{position:absolute;z-index:20;transform:translateY(-50%);}
  @keyframes pop{from{opacity:0;transform:translateY(-50%) scale(.7);}to{opacity:1;transform:translateY(-50%) scale(1);}}
  #insightToggle{
    position:absolute;right:16px;bottom:96px;z-index:60;width:52px;height:52px;border-radius:100px;
    background:var(--insight);color:#fff;border:none;display:flex;align-items:center;justify-content:center;
    box-shadow:0 12px 26px rgba(109,93,211,.45);cursor:pointer;
  }
  #insightToggle.off{background:var(--white);color:var(--insight);}
  .insight-banner{
    margin:0 22px 14px;background:var(--insight-light);border:1px solid #DDD5F7;border-radius:var(--radius-sm);
    padding:10px 14px;display:flex;gap:8px;align-items:flex-start;font-size:12px;color:#463A85;line-height:1.4;
  }

  /* Bottom nav */
  .bottom-nav{
    flex:0 0 auto;display:flex;justify-content:space-around;align-items:center;
    padding:10px 10px calc(env(safe-area-inset-bottom) + 10px);background:rgba(255,255,255,0.9);
    backdrop-filter:blur(14px);border-top:1px solid rgba(0,0,0,0.05);
  }
  .nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;cursor:pointer;color:var(--text-muted);width:60px;padding:4px 0;}
  .nav-item.active{color:var(--primary-dark);}
  .nav-item span.label{font-size:10.5px;font-weight:600;font-family:var(--font-body);}

  /* Splash */
  .splash{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 30%,#12503A 0%,#0B3324 65%,#082A1D 100%);color:#fff;}
  .splash .logo{width:88px;height:88px;border-radius:26px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;box-shadow:0 20px 40px rgba(0,0,0,.35);}
  .splash .logo .msr{font-size:44px;color:#fff;}
  .splash h1{font-family:var(--font-display);font-weight:800;font-size:26px;margin:0;letter-spacing:.01em;}
  .splash p{font-family:var(--font-body);font-size:13px;opacity:.75;margin:0;text-align:center;padding:0 40px;}
  .leaf-anim{position:absolute;font-family:'Material Symbols Rounded';color:rgba(255,255,255,.18);animation:fall linear infinite;}
  @keyframes fall{from{transform:translateY(-40px) rotate(0deg);}to{transform:translateY(820px) rotate(200deg);}}

  /* Onboarding */
  .onb-illustration{height:280px;display:flex;align-items:center;justify-content:center;margin:10px 0 6px;}
  .onb-illustration .ring{width:190px;height:190px;border-radius:100px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;}
  .onb-illustration .msr{font-size:84px;color:var(--primary-dark);}
  .dots{display:flex;gap:6px;justify-content:center;margin:14px 0 22px;}
  .dot{width:7px;height:7px;border-radius:100px;background:var(--mid-gray);transition:.2s;}
  .dot.active{width:22px;background:var(--primary);}

  /* Login */
  .login-hero{height:220px;background:linear-gradient(160deg,var(--secondary),var(--primary-dark));border-radius:0 0 40px 40px;display:flex;flex-direction:column;justify-content:flex-end;padding:24px;color:#fff;}
  .oauth-btn{display:flex;align-items:center;gap:10px;justify-content:center;width:100%;padding:14px;border-radius:100px;border:1.5px solid var(--mid-gray);background:#fff;font-family:var(--font-body);font-weight:600;font-size:14px;color:var(--secondary);cursor:pointer;}

  /* Home dashboard */
  .greeting{display:flex;justify-content:space-between;align-items:center;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0;}
  .stat-card{border-radius:var(--radius-md);padding:16px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-card);}
  .stat-card .msr{opacity:.9;}
  .stat-card .val{font-family:var(--font-display);font-weight:800;font-size:22px;margin-top:8px;}
  .stat-card .lbl{font-size:11px;opacity:.9;font-weight:600;}
  .stat-1{background:linear-gradient(135deg,#12A46B,#0B7A4C);}
  .stat-2{background:linear-gradient(135deg,#38BDF8,#0EA5E9);}
  .stat-3{background:linear-gradient(135deg,#FBBF24,#F59E0B);}
  .stat-4{background:linear-gradient(135deg,#1B4332,#12302A);}
  .ring-progress{width:56px;height:56px;border-radius:100px;background:conic-gradient(var(--primary) 0% 68%, #E4EEE8 68% 100%);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .ring-progress .inner{width:44px;height:44px;border-radius:100px;background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:12px;color:var(--secondary);}
  .quick-menu{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0;}
  .quick-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;}
  .quick-item .ic{width:52px;height:52px;border-radius:18px;background:var(--white);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-card);color:var(--primary-dark);}
  .quick-item span.t{font-size:10px;font-weight:600;text-align:center;color:var(--dark-gray);}
  .fab{
    position:absolute;right:18px;bottom:18px;width:58px;height:58px;border-radius:100px;
    background:linear-gradient(135deg,var(--primary),#0B7A4C);color:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 14px 28px rgba(11,122,76,.45);border:none;cursor:pointer;z-index:15;
  }
  .list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--light-gray);}
  .list-row:last-child{border-bottom:none;}
  .list-row .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}

  /* AI recommendation */
  .ai-banner{background:linear-gradient(135deg,#173B2C,#0B7A4C);border-radius:var(--radius-md);padding:18px;color:#fff;display:flex;gap:12px;align-items:center;}
  .conf-bar{height:6px;border-radius:100px;background:var(--light-gray);overflow:hidden;margin-top:6px;}
  .conf-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:100px;}
  .why-box{background:var(--accent-light);border-radius:var(--radius-sm);padding:12px 14px;font-size:12.5px;color:#075985;line-height:1.5;display:flex;gap:8px;}

  /* Food waste tracker */
  .bar-chart{display:flex;align-items:flex-end;gap:8px;height:120px;padding:10px 4px;}
  .bar{flex:1;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--primary),var(--primary-light));position:relative;}
  .bar .day{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:9.5px;color:var(--text-muted);font-weight:600;}
  .upload-zone{border:1.5px dashed var(--mid-gray);border-radius:var(--radius-md);padding:26px;text-align:center;color:var(--text-muted);}

  /* Green consumption */
  .menu-card{display:flex;gap:12px;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-card);padding:12px;margin-bottom:12px;}
  .menu-thumb{width:74px;height:74px;border-radius:14px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
  .filter-row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;}
  .filter-pill{flex:0 0 auto;padding:8px 14px;border-radius:100px;background:#fff;border:1.5px solid var(--mid-gray);font-size:12px;font-weight:600;color:var(--dark-gray);}
  .filter-pill.active{background:var(--secondary);color:#fff;border-color:var(--secondary);}

  /* Gamification */
  .level-card{background:linear-gradient(135deg,#F59E0B,#FBBF24);border-radius:var(--radius-md);padding:18px;color:#5A3A05;}
  .badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px;}
  .badge-item{display:flex;flex-direction:column;align-items:center;gap:5px;}
  .badge-icon{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;}
  .leader-row{display:flex;align-items:center;gap:10px;padding:10px 0;}
  .rank-num{width:26px;font-family:var(--font-display);font-weight:800;color:var(--text-muted);font-size:13px;text-align:center;}

  /* Community */
  .amb-card{display:flex;align-items:center;gap:10px;background:#fff;border-radius:var(--radius-md);padding:12px;box-shadow:var(--shadow-card);margin-bottom:10px;}
  .forum-card{background:#fff;border-radius:var(--radius-md);padding:14px;box-shadow:var(--shadow-card);margin-bottom:12px;}

  /* Sustainability dashboard */
  .donut{width:130px;height:130px;border-radius:100px;background:conic-gradient(var(--primary) 0% 42%, var(--accent) 42% 70%, var(--highlight) 70% 100%);display:flex;align-items:center;justify-content:center;margin:0 auto;}
  .donut .inner{width:96px;height:96px;background:#fff;border-radius:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;}

  /* Notifications */
  .notif-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--light-gray);}
  .notif-item .ic{width:40px;height:40px;border-radius:100px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}

  /* Profile */
  .profile-header{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 0 6px;}
  .profile-avatar{width:84px;height:84px;border-radius:100px;background:linear-gradient(135deg,var(--accent),var(--primary));display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:800;font-size:26px;box-shadow:var(--shadow-card);}
  .settings-row{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--light-gray);}

  .empty-state{display:flex;flex-direction:column;align-items:center;gap:8px;padding:40px 30px;text-align:center;color:var(--text-muted);}
  .toast-info{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--secondary);color:#fff;padding:9px 16px;border-radius:100px;font-size:12px;font-weight:600;z-index:80;opacity:0;pointer-events:none;transition:.25s;}
  .toast-info.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
</style>
</head>
<body>
<div class="stage">
  <div class="stage-label">ECONUDGE · Prototipe Interaktif Mobile-First</div>
  <div class="device">
    <div class="notch"></div>
    <div class="screen-wrap" id="screenWrap"></div>
  </div>
</div>
<div class="toast-info" id="toast"></div>

<script>
/* ============================ STATE ============================ */
const state = {
  phase: 'splash',      // splash | onboarding | login | app
  onbIndex: 0,
  screen: 'home',        // active screen inside app
  stack: ['home'],
  tab: 'home',
  insight: false,
  filter: 'Semua'
};
const TABS = ['home','konsumsi','challenge','komunitas','profil'];

/* ============================ HELPERS ============================ */
function icon(name, cls=''){ return `<span class="msr ${cls}">${name}</span>`; }
function goto(screen){
  if(TABS.includes(screen)){ state.tab = screen; state.screen = screen; state.stack=[screen]; }
  else { state.stack.push(state.screen); state.screen = screen; }
  render();
  document.getElementById('scrollHost')?.scrollTo(0,0);
}
function back(){
  if(state.stack.length>1){ state.stack.pop(); state.screen = state.stack[state.stack.length-1]; }
  else { state.screen='home'; state.tab='home'; }
  render();
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(()=>t.classList.remove('show'),1600);
}
function toggleInsight(){ state.insight = !state.insight; render(); }
function insightTag(text, top){
  return state.insight ? `<span class="insight-float insight-tag" style="top:${top}">${icon('psychology','')} ${text}</span>` : '';
}

/* ============================ SPLASH ============================ */
function screenSplash(){
  let leaves='';
  for(let i=0;i<10;i++){
    const left = Math.random()*330;
    const dur = (6+Math.random()*6).toFixed(1);
    const delay = (Math.random()*6).toFixed(1);
    const size = 18+Math.random()*14;
    leaves += `<span class="leaf-anim msr" style="left:${left}px;font-size:${size}px;animation-duration:${dur}s;animation-delay:-${delay}s;">eco</span>`;
  }
  return `
  <div class="splash">
    ${leaves}
    <div class="logo">${icon('eco','fill')}</div>
    <h1>ECONUDGE</h1>
    <p>Nudge kecil, dampak besar — menuju Zero Food Waste Campus</p>
    <div style="margin-top:26px;">
      <button class="btn btn-primary" onclick="state.phase='onboarding';render();">
        Mulai ${icon('arrow_forward','')}
      </button>
    </div>
  </div>`;
}

/* ============================ ONBOARDING ============================ */
const onbData = [
  {icon:'sentiment_dissatisfied', title:'Sisa Makanan Jadi Masalah Nyata', body:'Kantin kampus menghasilkan food waste setiap hari — berdampak pada biaya, lingkungan, dan target keberlanjutan kampus.', tag:'Masalah'},
  {icon:'neurology', title:'AI yang Mengenalmu', body:'ECONUDGE mempelajari pola makanmu dan memberi rekomendasi porsi & menu yang lebih tepat, lebih hemat, lebih rendah emisi.', tag:'AI Recommendation'},
  {icon:'redeem', title:'Kebiasaan Baik, Dapat Eco Point', body:'Setiap pilihan hijau yang kamu buat mengumpulkan Eco Point, badge, dan naik level — kebiasaan baik jadi terasa menyenangkan.', tag:'Eco Point'},
  {icon:'public', title:'Kontribusi Nyata untuk SDGs 12', body:'Setiap gram makanan yang tidak terbuang adalah kontribusimu pada Konsumsi & Produksi Bertanggung Jawab.', tag:'Dampak SDGs 12'}
];
function screenOnboarding(){
  const d = onbData[state.onbIndex];
  const dots = onbData.map((_,i)=>`<span class="dot ${i===state.onbIndex?'active':''}"></span>`).join('');
  const isLast = state.onbIndex === onbData.length-1;
  return `
  <div class="top-app-bar" style="justify-content:flex-end;">
    <button class="btn btn-ghost" style="font-size:13px;" onclick="state.phase='login';render();">Lewati</button>
  </div>
  <div class="content px">
    <span class="eyebrow">${d.tag}</span>
    <div class="onb-illustration"><div class="ring">${icon(d.icon,'')}</div></div>
    <h2 style="font-family:var(--font-display);font-size:22px;color:var(--secondary);margin:6px 0 10px;">${d.title}</h2>
    <p style="color:var(--text-muted);font-size:14px;line-height:1.6;">${d.body}</p>
    <div class="dots">${dots}</div>
  </div>
  <div class="px" style="padding-bottom:26px;">
    <button class="btn btn-primary btn-block" onclick="nextOnb()">${isLast?'Masuk':'Lanjut'} ${icon('arrow_forward','')}</button>
  </div>`;
}
function nextOnb(){
  if(state.onbIndex < onbData.length-1){ state.onbIndex++; }
  else { state.phase='login'; }
  render();
}

/* ============================ LOGIN ============================ */
function screenLogin(){
  return `
  <div class="login-hero">
    <div style="width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;margin-bottom:12px;">${icon('eco','fill')}</div>
    <h1 style="font-family:var(--font-display);font-size:24px;margin:0 0 4px;">Selamat Datang</h1>
    <p style="font-size:13px;opacity:.85;margin:0;">Masuk untuk mulai perjalanan hijaumu</p>
  </div>
  <div class="content px" style="padding-top:24px;">
    <button class="oauth-btn" style="margin-bottom:10px;" onclick="enterApp()">${icon('school','')} Masuk dengan SSO Kampus</button>
    <button class="oauth-btn" style="margin-bottom:10px;" onclick="enterApp()">${icon('mail','')} Google</button>

      <div class="stat-card stat-1">${icon('cloud','fill')}<div class="val">31.6 kg</div><div class="lbl">CO₂ Dihemat / Bulan</div></div>
      <div class="stat-card stat-2">${icon('delete_sweep','fill')}<div class="val">9.2 kg</div><div class="lbl">Waste Dicegah</div></div>
    </div>

    <div class="section-title">Riwayat Perilaku</div>
    <div class="card">
      <div class="bar-chart">${[30,45,55,70,60,80,75].map((h,i)=>`<div class="bar" style="height:${h}%;"><span class="day">M${i+1}</span></div>`).join('')}</div>
    </div>
  </div>`;
}

/* ============================ NOTIFICATIONS ============================ */
const notifData = [
  {icon:'restaurant', bg:'var(--primary-light)', fg:'var(--primary-dark)', title:'Waktunya makan siang', body:'Jangan lupa catat porsi sesuai rekomendasi AI ya.', time:'10 menit lalu'},
  {icon:'eco', bg:'var(--accent-light)', fg:'#0369A1', title:'Menu rendah emisi tersedia', body:'Gado-Gado Mini di Kantin Barat baru saja tersedia.', time:'1 jam lalu'},
  {icon:'flag', bg:'#FEE2E2', fg:'#B91C1C', title:'Target harian belum tercapai', body:'Kamu baru mencatat 1 dari 3 kali makan hari ini.', time:'3 jam lalu'},
  {icon:'military_tech', bg:'#FEF3C7', fg:'var(--highlight-dark)', title:'Badge baru diperoleh!', body:'Selamat, kamu mendapat badge "3-Day Streak".', time:'Kemarin'},
  {icon:'emoji_events', bg:'var(--primary-light)', fg:'var(--primary-dark)', title:'Challenge selesai', body:'"Habiskan porsi tanpa sisa 3x" berhasil diselesaikan.', time:'Kemarin'},
];
function screenNotifications(){
  const items = notifData.map(n=>`
    <div class="notif-item">
      <div class="ic" style="background:${n.bg};color:${n.fg};">${icon(n.icon,'')}</div>
      <div style="flex:1;">
        <div style="font-weight:700;font-size:13px;color:var(--secondary);">${n.title}</div>
        <div style="font-size:11.5px;color:var(--text-muted);margin:2px 0;">${n.body}</div>
        <div style="font-size:10px;color:var(--mid-gray);">${n.time}</div>
      </div>
    </div>`).join('');
  return `
  <div class="top-app-bar">
    <button class="icon-btn" onclick="back()">${icon('arrow_back','')}</button>
    <div style="font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--secondary);">Notifikasi</div>
    <button class="icon-btn" onclick="toast('Semua ditandai dibaca')">${icon('done_all','')}</button>
  </div>
  <div class="content px" id="scrollHost" style="padding-bottom:30px;">${items}</div>`;
}

/* ============================ PROFILE (tab) ============================ */
function screenProfil(){
  return `
  <div class="content px" id="scrollHost" style="padding-top:14px;padding-bottom:100px;">
    <div class="profile-header">
      <div class="profile-avatar">SB</div>
      <div style="font-family:var(--font-display);font-weight:800;font-size:17px;color:var(--secondary);">Sibro</div>
      <div style="font-size:12px;color:var(--text-muted);">Pendidikan Teknik Otomotif · KIP Kuliah</div>
    </div>

    <div class="stat-grid" style="margin:16px 0;">
      <div class="stat-card stat-4">${icon('emoji_events','fill')}<div class="val">860</div><div class="lbl">Total Eco Point</div></div>
      <div class="stat-card stat-1">${icon('local_fire_department','fill')}<div class="val">3 hari</div><div class="lbl">Streak Aktif</div></div>
    </div>

    <div class="section-title">Preferensi &amp; Target</div>
    <div class="card" style="margin-bottom:16px;">
      <div class="settings-row"><span style="font-size:13px;color:var(--dark-gray);">Preferensi makanan</span><span style="font-size:12px;color:var(--text-muted);">Vegetarian-friendly ${icon('chevron_right','')}</span></div>
      <div class="settings-row"><span style="font-size:13px;color:var(--dark-gray);">Target konsumsi harian</span><span style="font-size:12px;color:var(--text-muted);">Rp30.000 ${icon('chevron_right','')}</span></div>
      <div class="settings-row" style="border-bottom:none;"><span style="font-size:13px;color:var(--dark-gray);">Riwayat aktivitas</span><span style="font-size:12px;color:var(--text-muted);">Lihat semua ${icon('chevron_right','')}</span></div>
    </div>

    <div class="section-title">Pengaturan Akun</div>
    <div class="card">
      <div class="settings-row"><span style="font-size:13px;color:var(--dark-gray);">Notifikasi</span>${icon('toggle_on','fill')}</div>
      <div class="settings-row"><span style="font-size:13px;color:var(--dark-gray);">Bahasa</span><span style="font-size:12px;color:var(--text-muted);">Indonesia ${icon('chevron_right','')}</span></div>
      <div class="settings-row" style="border-bottom:none;"><span style="font-size:13px;color:var(--danger);">Keluar</span>${icon('logout','')}</div>
    </div>
  </div>`;

/* ============================ SHELL: header + bottom nav ============================ */
function bottomNav(){
  const items = [
    {id:'home', ic:'home', label:'Beranda'},
    {id:'konsumsi', ic:'restaurant', label:'Konsumsi'},
    {id:'challenge', ic:'emoji_events', label:'Challenge'},
    {id:'komunitas', ic:'groups', label:'Komunitas'},
    {id:'profil', ic:'person', label:'Profil'},
  ];
  return `<div class="bottom-nav">${items.map(i=>`
    <button class="nav-item ${state.tab===i.id?'active':''}" onclick="goto('${i.id}')">
      ${icon(i.ic, state.tab===i.id?'fill':'')}
      <span class="label">${i.label}</span>
    </button>`).join('')}</div>`;
}

const detailScreens = ['aiRec','wasteTracker','sustainability','notifications'];

function renderApp(){
  const map = {
    home: screenHome, konsumsi: screenKonsumsi, challenge: screenChallenge,
    komunitas: screenKomunitas, profil: screenProfil,
    aiRec: screenAiRec, wasteTracker: screenWasteTracker,
    sustainability: screenSustainability, notifications: screenNotifications
  };
  const body = map[state.screen] ? map[state.screen]() : screenHome();
  const showNav = TABS.includes(state.screen);
  return `${body}${showNav ? bottomNav() : ''}
  <button id="insightToggle" class="${state.insight?'':'off'}" onclick="toggleInsight()" title="Tampilkan pemetaan perilaku">
    ${icon('psychology', state.insight ? 'fill':'')}
  </button>`;
}

/* ============================ ROOT RENDER ============================ */
function render(){
  const wrap = document.getElementById('screenWrap');
  let html = '';
  if(state.phase==='splash') html = screenSplash();
  else if(state.phase==='onboarding') html = `<div class="statusbar"><span>9:41</span><div class="icons">${icon('signal_cellular_alt','')}${icon('wifi','')}${icon('battery_full','')}</div></div>` + screenOnboarding();
  else if(state.phase==='login') html = `<div class="statusbar"><span>9:41</span><div class="icons">${icon('signal_cellular_alt','')}${icon('wifi','')}${icon('battery_full','')}</div></div>` + screenLogin();
  else html = `<div class="statusbar"><span>9:41</span><div class="icons">${icon('signal_cellular_alt','')}${icon('wifi','')}${icon('battery_full','')}</div></div>` + renderApp();
  wrap.innerHTML = html;
}
render();
</script>
